<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1d1b22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Home Clean" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <title>Home Clean Makeover</title>
    <style>
      html, body { margin: 0; height: 100%; height: 100dvh; background: #1d1b22; overflow: hidden; touch-action: none;
        overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; touch-action: none; }
      .menu { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
        padding: calc(24px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); box-sizing: border-box;
        background: linear-gradient(#f7efe4, #efe2d0); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #3a2d26; touch-action: pan-y; }
      .menu h1 { margin: 8px 0 2px; font-size: 30px; text-align: center; }
      .menu .sub { margin: 0 0 18px; text-align: center; color: #8a7564; }
      .menu h2 { font-size: 17px; margin: 18px 4px 8px; }
      .menu .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
      .menu .lv { display: flex; align-items: center; justify-content: center; min-height: 64px; padding: 8px; border-radius: 16px;
        background: #fff; color: #3a2d26; text-decoration: none; font-weight: 700; text-align: center; box-shadow: 0 2px 0 #d9c8b0; }
      .menu .lv.done { background: #dff3dc; box-shadow: 0 2px 0 #9fd39a; }
      .menu .lv.done::after { content: " ✓"; color: #3f9e3c; }
      .home { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 12px; width: 38px; height: 38px; border-radius: 19px;
        display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); color: #fff; text-decoration: none; font-size: 20px; }
      #loading { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center;
        background: #1b1830 url('./data/story/bg_loading.webp') center / cover; color: #fff;
        font-family: system-ui, -apple-system, sans-serif; transition: opacity .4s ease; }
      #loading::before { content: ""; position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(rgba(20,16,40,.15) 0%, rgba(20,16,40,0) 35%, rgba(20,16,40,.25) 70%, rgba(20,16,40,.85) 100%); }
      #loading > * { position: relative; }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading img { width: min(74vw, 320px); margin-top: calc(9vh + env(safe-area-inset-top)); filter: drop-shadow(0 8px 16px rgba(0,0,0,.45));
        animation: logoIn .6s cubic-bezier(.2,1.4,.4,1) both, float 2.6s ease-in-out .6s infinite; }
      #loading .foot { margin-top: auto; margin-bottom: calc(9vh + env(safe-area-inset-bottom)); width: min(72vw, 300px); text-align: center; }
      #loading .bar { height: 14px; border-radius: 7px; padding: 2px; background: rgba(0,0,0,.45); box-shadow: inset 0 1px 2px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.25); }
      #loading .bar i { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(#8fe86a, #45b83c);
        box-shadow: inset 0 2px 0 rgba(255,255,255,.45); position: relative; overflow: hidden; }
      #loading .bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
        transform: translateX(-100%); animation: sheen 1.4s ease-in-out infinite; }
      #loading p { margin: 10px 0 0; font-weight: 800; font-size: 15px; letter-spacing: .3px; text-shadow: 0 2px 4px rgba(0,0,0,.7); }
      @keyframes logoIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
      @keyframes float { 50% { transform: translateY(-8px); } }
      @keyframes sheen { to { transform: translateX(100%); } }
      /* home */
      .homepage.menu { position: fixed; background: #241c33 url('./data/story/bg_loading.webp') center / cover; color: #fff; }
      .homepage.menu::before { content: ""; position: fixed; inset: 0; background: linear-gradient(rgba(36,28,51,.55), rgba(36,28,51,.9)); pointer-events: none; }
      .homepage.menu > * { position: relative; }
      .homepage .logo { display: block; width: min(72vw, 300px); margin: 0 auto 10px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.4)); }
      .homepage .sum { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin: 0 4px 18px; font-weight: 700; }
      .homepage .sum i, .chapter .bar i { grid-column: 1 / -1; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #6fd36a var(--p), rgba(255,255,255,.2) var(--p)); }
      .chapter { margin-bottom: 18px; border-radius: 22px; overflow: hidden; background: rgba(255,255,255,.96); color: #3a2d26; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
      .chapter .cover { position: relative; height: 210px; background: center 30% / cover; cursor: pointer; }
      .chapter .shade { position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgba(0,0,0,.65)); }
      .chapter h2 { position: absolute; left: 16px; bottom: 34px; margin: 0; color: #fff; font-size: 22px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
      .chapter .bar { position: absolute; left: 16px; right: 120px; bottom: 14px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; color: #fff; font-weight: 700; font-size: 13px; }
      .chapter .bar i { grid-column: 1; }
      .chapter .play, .chapter .badge { position: absolute; right: 12px; bottom: 10px; padding: 10px 16px; border-radius: 22px; background: #5bbf72; color: #fff; font-weight: 800; text-decoration: none; box-shadow: 0 3px 0 #3f9653; }
      .chapter .badge { background: #f2c94c; color: #5a4300; box-shadow: none; }
      .chapter .badge.lock { background: rgba(0,0,0,.55); color: #fff; }
      .chapter .story-btn { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 20px; border: 0; background: rgba(255,255,255,.85); font-size: 18px; }
      .chapter.locked .cover { filter: grayscale(.8) brightness(.7); cursor: default; }
      .menu .lv.locked { opacity: .45; }
      .menu .lv.locked::after { content: " 🔒"; }
      /* story */
      .story { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; animation: fadein .35s ease; }
      .story.out { opacity: 0; transition: opacity .25s; }
      .story img { flex: 1; min-height: 0; width: 100%; object-fit: cover; animation: kenburns 9s ease-out both; }
      .story .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.85) 35%);
        color: #fff; font: 600 18px/1.45 system-ui, -apple-system, sans-serif; text-align: center; }
      .story .cap p { margin: 0 0 16px; }
      .story button, .cheat button, .room-ui .go { border: 0; border-radius: 24px; padding: 12px 26px; font: 800 17px system-ui, -apple-system, sans-serif; background: #5bbf72; color: #fff; box-shadow: 0 3px 0 #3f9653; }
      @keyframes fadein { from { opacity: 0; } }
      @keyframes kenburns { from { transform: scale(1.08); } to { transform: scale(1); } }
      /* room */
      .room-ui { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, -apple-system, sans-serif; }
      .room-ui header { pointer-events: auto; position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; right: 64px; display: flex; gap: 10px; align-items: center; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
      .room-ui header div { display: flex; flex-direction: column; }
      .room-ui header b { font-size: 20px; }
      .room-ui .back { width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,.4); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 30px; text-decoration: none; }
      .room-ui footer > * { pointer-events: auto; }
      .room-ui header, .room-ui footer { z-index: 2; }
      .room-ui footer { pointer-events: none; position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.6)); display: flex; flex-direction: column; gap: 10px; align-items: center; }
      .room-ui .count { font-size: 13px; font-weight: 600; opacity: .9; }
      .room-ui .pins { position: absolute; inset: 0; overflow: hidden; transition: opacity .3s; }
      .room-ui .pins.hidden { opacity: 0; pointer-events: none; }
      .room-ui .pin { pointer-events: auto; position: absolute; left: 0; top: 0; width: 0; height: 0; text-decoration: none; color: #fff; }
      .room-ui .pin .disc { position: absolute; left: -29px; top: -29px; width: 58px; height: 58px; border-radius: 50%; box-sizing: border-box;
        background: radial-gradient(#fffaf2, #f1e3cf); border: 3px solid #fff; box-shadow: 0 4px 12px rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; overflow: hidden; }
      .room-ui .pin img { max-width: 44px; max-height: 44px; object-fit: contain; }
      .room-ui .pin .disc.glyph { background: radial-gradient(#6aa8ec, #3f7fcf); }
      .room-ui .pin .disc.glyph img { max-width: 34px; max-height: 34px; }
      .room-ui .pin i { position: absolute; right: -32px; top: -34px; width: 24px; height: 24px; border-radius: 50%; display: none; align-items: center; justify-content: center;
        font: normal 800 14px system-ui, sans-serif; box-shadow: 0 2px 4px rgba(0,0,0,.35); }
      .room-ui .pin em { position: absolute; left: 50%; top: 32px; transform: translateX(-50%); white-space: nowrap; font: normal 800 12px system-ui, sans-serif;
        padding: 3px 9px; border-radius: 10px; background: rgba(0,0,0,.55); display: none; }
      .room-ui .pin.done .disc { border-color: #6fd36a; transform: scale(.8); opacity: .92; }
      .room-ui .pin.done i { transform: translate(-6px, 6px); }
      .room-ui .pin.done i { display: flex; background: #4fb84a; color: #fff; }
      .room-ui .pin.done i::before { content: "✓"; }
      .room-ui .pin.locked .disc { filter: grayscale(1) brightness(.75); border-color: rgba(255,255,255,.6); }
      .room-ui .pin.locked i { display: flex; background: rgba(0,0,0,.65); font-size: 12px; }
      .room-ui .pin.locked i::before { content: "🔒"; }
      .room-ui .pin.open .disc { border-color: #f2c94c; }
      .room-ui .pin.next .disc { animation: pinpulse 1.4s ease-in-out infinite; }
      .room-ui .pin.next em { display: block; background: #f2a93b; }
      .room-ui .pin.pop .disc { animation: pinpop .6s ease-out; }
      .room-ui .pin.shake .disc { animation: pinshake .4s; }
      @keyframes pinpulse { 0%, 100% { transform: scale(1); box-shadow: 0 4px 12px rgba(0,0,0,.45), 0 0 0 0 rgba(242,201,76,.8); }
        50% { transform: scale(1.1); box-shadow: 0 4px 12px rgba(0,0,0,.45), 0 0 0 10px rgba(242,201,76,0); } }
      @keyframes pinpop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
      @keyframes pinshake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
      .room-ui .toast { position: absolute; left: 50%; top: calc(76px + env(safe-area-inset-top)); transform: translateX(-50%); padding: 10px 16px; border-radius: 16px;
        background: rgba(0,0,0,.75); color: #fff; font-weight: 700; font-size: 14px; white-space: nowrap; opacity: 0; pointer-events: none; }
      .room-ui .toast.on { animation: toast 2.2s ease both; }
      @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -8px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
      .room-ui .spark { position: absolute; width: 14px; height: 14px; margin: -7px; pointer-events: none; background: radial-gradient(#fff 15%, #ffe27a 40%, transparent 70%);
        border-radius: 50%; animation: spark 1.1s ease-out both; }
      @keyframes spark { 0% { transform: translate(0, 0) scale(.4); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; } }
      .room-ui .go { text-decoration: none; }
      .room-ui .go.done { background: #f2c94c; color: #5a4300; box-shadow: none; }
      /* cheat */
      .cheat-btn { position: fixed; z-index: 15; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 20px; }
      .cheat { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; font-family: system-ui, -apple-system, sans-serif; }
      .cheat .panel { width: 100%; max-width: 520px; max-height: 82dvh; overflow-y: auto; background: #fff; color: #3a2d26; border-radius: 22px 22px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom)); box-sizing: border-box; touch-action: pan-y; }
      .cheat header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
      .cheat .x { background: #eee; color: #333; box-shadow: none; padding: 6px 12px; }
      .cheat h3 { margin: 14px 0 8px; font-size: 14px; color: #8a7564; text-transform: uppercase; letter-spacing: .04em; }
      .cheat .row, .cheat .steps { display: flex; flex-wrap: wrap; gap: 8px; }
      .cheat .row button, .cheat .steps button { padding: 8px 12px; font-size: 14px; background: #4f8fd8; box-shadow: none; }
      .cheat .steps button { background: #eef2f7; color: #334; }
      .cheat .steps button.cur { background: #f2c94c; color: #5a4300; }
      .cheat .ch { margin-bottom: 8px; }
      .cheat .ch span { font-weight: 800; font-size: 14px; }
      .cheat .lvls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      .cheat .lvls a { padding: 6px 10px; border-radius: 12px; background: #f3ede4; color: #3a2d26; text-decoration: none; font-size: 13px; font-weight: 600; }
      #rotate { display: none; }
      @media (orientation: landscape) and (max-height: 520px) {
        #rotate { display: flex; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center;
          background: #1d1b22; color: #fff; font: 600 18px system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
        #rotate .phone { width: 36px; height: 60px; border: 3px solid #fff; border-radius: 8px; margin-bottom: 16px; animation: turn 1.6s ease-in-out infinite; }
        @keyframes turn { 0%, 30% { transform: rotate(-90deg); } 70%, 100% { transform: rotate(0); } }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading"><img src="./data/story/Logo.webp" alt="" /><div class="foot"><div class="bar"><i></i></div><p>Đang tải… 0%</p></div></div>
    <div id="rotate"><div class="phone"></div>Xoay dọc điện thoại để chơi</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
